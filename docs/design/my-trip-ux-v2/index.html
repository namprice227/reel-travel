<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Trip UX v2 — review gallery</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1f6;color:#19334f;font:15px/1.5 system-ui,sans-serif}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d9e1eb}h1{font-size:22px;margin:0}p{margin:5px 0;color:#566c85;font-size:13px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}button,a{font:inherit;color:#1d5eb7}button{padding:10px 14px;background:#f7f9fc;border:1px solid #cbd8e8;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#216bd9;color:white;border-color:#216bd9}a{padding:10px;display:inline-block}main{padding:18px;max-width:1600px;margin:auto}img{width:100%;height:auto;display:block;border:1px solid #d5dfeb;border-radius:8px;background:white}:focus-visible{outline:3px solid #1d5eb7;outline-offset:3px}.links{display:flex;gap:8px;flex-wrap:wrap}#caption{margin:10px 0}</style></head>
<body><header><h1>My Trip UX v2</h1><p>Proposed screens · synthetic examples · map is a schematic · application changes pending</p><nav aria-label="Review screens"><button data-n="1" aria-pressed="true">1 · My Trips</button><button data-n="2" aria-pressed="false">2 · Selected place</button><button data-n="3" aria-pressed="false">3 · Edit mode</button><button data-n="4" aria-pressed="false">4 · All Trips</button><button data-n="5" aria-pressed="false">5 · Mobile</button></nav></header>
<main><p id="caption" role="status">My Trips: compact toolbar and visible All trips control.</p><img id="preview" src="01-preview.png" alt="Proposed compact My Trips overview"><div class="links"><a href="review-board.pdf">Open all five screens as PDF</a><a href="review-board.html">Open full-size HTML boards</a><a href="README.md">Read the implementation plan</a></div></main>
<script>const captions=['My Trips: compact toolbar and visible All trips control.','Selected place: Edit day beside the heading; title, hours and Full details above the map.','Edit mode: explicit controls, fixed bookings and visible save state.','All Trips: one compact toolbar, search, filters and useful trip rows.','Mobile: selected place opens in a focused bottom sheet.'];document.querySelectorAll('button[data-n]').forEach(button=>button.addEventListener('click',()=>{const n=Number(button.dataset.n);document.querySelectorAll('button[data-n]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const image=document.getElementById('preview');image.src='0'+n+'-preview.png';image.alt=captions[n-1];document.getElementById('caption').textContent=captions[n-1];}));</script></body></html>
